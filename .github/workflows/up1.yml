name: openwrt-xr30-rax3000m

on:
  repository_dispatch:
  workflow_dispatch:
    inputs:             
      OP_IP:
        description: '静态IP地址'     
        required: false
        default: '192.168.1.88' 
        type: string
      OP_author:
        description: '定制作者'     
        required: false
        default: 'keben' 
        type: string    
      CUSTOM_PLUGINS:
        description: '自定义插件名称，用空格分隔'
        required: false
        default: 'luci-theme-bootstrap luci-app-ttyd luci-app-diskman luci-app-ksmbd luci-app-openclash luci-app-passwall'
        type: string

env:
  DIY_P1_SH: sh/op.sh

jobs:
  build_firmware:
    name: 编译固件 - ${{ matrix.device }} - ${{ matrix.source }}
    runs-on: ubuntu-22.04
    strategy:
       matrix:
        device: ["rax3000m-nand", "xr30-nand"]
        source: ["openwrt"]
        include:
          - device: "rax3000m-nand"
            config: "CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_cmcc_rax3000m-nand=y"
          - device: "xr30-nand"
            config: "CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_cmcc_xr30-nand=y"
          
    steps: 
    - name: 检查分支
      uses: actions/checkout@v4

    - name: 编译环境依赖
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo apt-get update
        sudo apt-get install -y tar build-essential flex bison cmake g++ gawk gcc-multilib g++-multilib gettext git libfuse-dev libncurses5-dev libssl-dev python3 python3-pip python3-ply python3-distutils python3-pyelftools rsync unzip zlib1g-dev file wget subversion patch upx-ucl autoconf automake curl asciidoc binutils bzip2 lib32gcc-s1 libc6-dev-i386 uglifyjs msmtp texinfo libreadline-dev libglib2.0-dev xmlto libelf-dev libtool autopoint antlr3 gperf ccache swig coreutils haveged scons libpython3-dev rename qemu-utils
        sudo apt-get clean
        git config --global user.name 'GitHub Actions' && git config --global user.email 'noreply@github.com'
        sudo timedatectl set-timezone 'Asia/Shanghai'

    - name: 设置环境变量
      run: |
        TAG="$(date +'%Y%m%d')"
        echo "tag=$TAG" >> $GITHUB_ENV
        echo "OP_IP=${{ github.event.inputs.OP_IP }}" >> $GITHUB_ENV
        echo "OP_author=${{ github.event.inputs.OP_author }}" >> $GITHUB_ENV
        echo "CUSTOM_PLUGINS=${{ github.event.inputs.CUSTOM_PLUGINS }}" >> $GITHUB_ENV
        echo "DEVICE_NAME=${{ matrix.device }}" >> $GITHUB_ENV
        echo "SOURCE_NAME=${{ matrix.source }}" >> $GITHUB_ENV
        echo "REPO_URL=https://github.com/shiyu1314/openwrt-source" >> $GITHUB_ENV
        echo "REPO_BRANCH=openwrt-25.12" >> $GITHUB_ENV

    - name: 克隆源代码
      run: |
        mkdir -p $GITHUB_WORKSPACE/workdir
        cd $GITHUB_WORKSPACE/workdir
        git clone $REPO_URL $SOURCE_NAME
        ln -sf $GITHUB_WORKSPACE/workdir/$SOURCE_NAME $GITHUB_WORKSPACE/$SOURCE_NAME

    - name: 切换分支
      run: |
        cd $GITHUB_WORKSPACE/$SOURCE_NAME
        case $REPO_BRANCH in
          openwrt-25.12)
            _release_tag=$(git tag --sort=taggerdate --list 'v25.*' | tail -1)
            git checkout $_release_tag
            _prerelease=false
            ;;
          *)
            echo "Can't get local/upstream's branch/tags"
            ;;
        esac
        echo "release_tag=$_release_tag" >> $GITHUB_ENV  

    - name: 取回缓存 staging_dir
      uses: actions/cache@v4
      with:
        path: |
          ${{ matrix.source }}/staging_dir
        key: ${{ matrix.source }}-toolchain-cache
        restore-keys: |
          ${{ matrix.source }}-toolchain-cache

    - name: patch修补
      run: |
        set -x
        cd $GITHUB_WORKSPACE/$SOURCE_NAME
        ./scripts/feeds update -a
        ./scripts/feeds install -a
        [ -e $GITHUB_WORKSPACE/patch ] && cp -rf $GITHUB_WORKSPACE/patch/diy/*.patch .
        [ -e $GITHUB_WORKSPACE/patch ] && cp -rf $GITHUB_WORKSPACE/patch/luci/*.patch feeds/luci
    - name: 修复Rust编译
      run: |
        cd $GITHUB_WORKSPACE/$SOURCE_NAME
        RUST_FILE=$(find feeds/packages -type f -path "*/rust/Makefile")
        if [ -f "$RUST_FILE" ]; then
          sed -i 's/ci-llvm=true/ci-llvm=false/g' $RUST_FILE
          echo "Rust CI LLVM disabled"
        fi
    - name: 修复daed
      run: |
         # 修复 bpf-headers for kernel 6.x
         find package -path "*/bpf-headers/Makefile" | while read file; do
         sed -i 's|include $(INCLUDE_DIR)/kernel-$(PKG_PATCHVER)|include $(LINUX_DIR)|' $file
         done
    
    - name: 加载自定义脚本
      run: |
        chmod +x $DIY_P1_SH
        cd $GITHUB_WORKSPACE/$SOURCE_NAME
        $GITHUB_WORKSPACE/$DIY_P1_SH
        cd ..
        # nginx luci support
        if [ -f $GITHUB_WORKSPACE/patch/nginx/luci.locations ]; then
        mkdir -p feeds/packages/net/nginx/files-luci-support
        cp -f $GITHUB_WORKSPACE/patch/nginx/luci.locations \
        feeds/packages/net/nginx/files-luci-support/
        fi

        # nginx util template
        if [ -f $GITHUB_WORKSPACE/patch/nginx/uci.conf.template ]; then
        mkdir -p feeds/packages/net/nginx-util/files
        cp -f $GITHUB_WORKSPACE/patch/nginx/uci.conf.template \
        feeds/packages/net/nginx-util/files/
        fi

    - name: 加载自定义配置
      run: |
        cd $GITHUB_WORKSPACE/$SOURCE_NAME
        [ -e $GITHUB_WORKSPACE/files ] && mv $GITHUB_WORKSPACE/files files
        cat <<EOF >>.config
        CONFIG_TARGET_mediatek=y
        CONFIG_TARGET_mediatek_filogic=y
        ${{ matrix.config }}
        EOF
        [ -e $GITHUB_WORKSPACE/config/config-common ] && cat $GITHUB_WORKSPACE/config/config-common >> .config
        sed -i "s/192.168.1.1/${{ github.event.inputs.OP_IP }}/" package/base-files/files/bin/config_generate
        IFS=' ' read -r -a plugins <<< "${{ github.event.inputs.CUSTOM_PLUGINS }}"
        for plugin in "${plugins[@]}"; do
          echo "CONFIG_PACKAGE_${plugin}=y" >> .config
        done

    - name: 下载编译依赖
      run: |
        cd $GITHUB_WORKSPACE/$SOURCE_NAME
        make defconfig
        make download -j8
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    - name: 编译源码
      run: |
        cd $GITHUB_WORKSPACE/$SOURCE_NAME
        echo -e "$(nproc) thread compile"
        make -j$(nproc) || make -j1 || make -j1 V=s

    - name: 查看磁盘使用情况
      if: (!cancelled())
      run: df -hT

    - name: 整理文件
      run: |
        cd $GITHUB_WORKSPACE/$SOURCE_NAME/bin/targets/*/*
        rm -rf packages *.buildinfo profiles.json *.manifest *bl2.bin *kernel.bin *.sha sha256sums
        echo "FIRMWARE=$PWD" >> $GITHUB_ENV

    - name: 上传固件到Releases
      uses: softprops/action-gh-release@v3
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ env.release_tag }}-${{env.tag}}
        files: ${{ env.FIRMWARE }}/*
        body: |
          ====================固件信息=======================
          分支：${{ env.release_tag }}
          静态IP：${{ github.event.inputs.OP_IP }}
          插件：${{ github.event.inputs.CUSTOM_PLUGINS }}
          定制作者：${{ github.event.inputs.OP_author }}
          默认密码：无

    - name: 清理Releases
      uses: dev-drprasad/delete-older-releases@v0.3.4
      with:
        keep_latest: 1
        delete_tags: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
